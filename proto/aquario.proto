syntax = "proto3";

package aquario;

option java_package = "br.ufc.sd.aquario.proto";
option java_multiple_files = true;

enum TipoFonte {
  TIPO_DESCONHECIDO = 0;
  LUMINARIA = 1;
  TOMADA_CO2 = 2;
  TOMADA_LUMINARIA = 3;
  SENSOR_PH = 4;
  SENSOR_TEMPERATURA = 5;
}

message Status {
  bool ligada = 1;
  uint32 intervalo_envio_s = 2;
  map<string, double> parametros = 3;
  bool em_falha = 4;
  string detalhe = 5;
}

message DiscoveryRequest {
  string gateway_ip = 1;
  uint32 porta_resposta = 2;
  uint32 porta_dados = 3;
}

message DiscoveryResponse {
  string fonte_id = 1;
  TipoFonte tipo = 2;
  string ip = 3;
  uint32 porta_grpc = 4;
  bool controlavel = 5;
  Status estado = 6;
}

message Medida {
  string nome = 1;
  double valor = 2;
  string unidade = 3;
}

message Leitura {
  string fonte_id = 1;
  TipoFonte tipo = 2;
  int64 timestamp_ms = 3;
  repeated Medida medidas = 4;
  bool evento = 5;
  string motivo_evento = 6;
}

service FonteControlavel {
  rpc GetStatus(Vazio) returns (Status);
  rpc SetPower(ComandoPower) returns (Status);
  rpc SetParametro(ComandoParametro) returns (Status);
  rpc SimularFalha(ComandoFalha) returns (Status);
}

message Vazio {}

message ComandoPower {
  bool ligada = 1;
}

message ComandoParametro {
  string nome = 1;
  double valor = 2;
}

message ComandoFalha {
  bool ativa = 1;
}

message Requisicao {
  oneof tipo {
    ListarFontes listar = 1;
    Comando comando = 2;
    Consulta consulta = 3;
    PedidoHistorico historico = 4;
  }
}

message ListarFontes {}

message Comando {
  string fonte_id = 1;
  oneof acao {
    ComandoPower power = 2;
    ComandoParametro parametro = 3;
    ComandoFalha falha = 4;
  }
}

enum TipoConsulta {
  CONSULTA_DESCONHECIDA = 0;
  MEDIA_DESVIO = 1;
  CONSUMO_WH = 2;
  TEMPO_LIGADO = 3;
  PH_MIN_ALERTAS = 4;
  MAIOR_VARIACAO = 5;
}

message Consulta {
  TipoConsulta tipo = 1;
  string fonte_id = 2;
  string medida = 3;
  uint32 janela_min = 4;
}

message PedidoHistorico {
  string fonte_id = 1;
  string medida = 2;
  uint32 janela_min = 3;
  uint32 max_pontos = 4;
}

message InfoFonte {
  string fonte_id = 1;
  TipoFonte tipo = 2;
  string ip = 3;
  uint32 porta_grpc = 4;
  bool controlavel = 5;
  bool online = 6;
  Status estado = 7;
  Leitura ultima_leitura = 8;
  int64 visto_em_ms = 9;
}

message ListaFontes {
  repeated InfoFonte fontes = 1;
}

message LinhaResultado {
  string chave = 1;
  double valor = 2;
  string unidade = 3;
}

message ResultadoConsulta {
  string descricao = 1;
  repeated LinhaResultado linhas = 2;
}

message Ponto {
  int64 timestamp_ms = 1;
  double valor = 2;
}

message SerieHistorica {
  string fonte_id = 1;
  string medida = 2;
  repeated Ponto pontos = 3;
}

message Resposta {
  bool ok = 1;
  string erro = 2;
  oneof corpo {
    ListaFontes fontes = 3;
    Status estado = 4;
    ResultadoConsulta resultado = 5;
    SerieHistorica serie = 6;
  }
}
